# Tooling configuration only — the application itself has no build step and no runtime dependencies
# (Python 3.10+ standard library). Development tools are listed in requirements-dev.txt.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that spawn a subprocess (run.py start-up checks)",
]

[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = ["i18n", "static", "content"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# The code base deliberately uses long lines (SQL, HTML templates, seed data); the limit is not enforced.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Parametric quiz templates set up several physics quantities on one line (R = …; I = …; U = I * R).
"app/engine.py" = ["E702"]

[tool.mypy]
python_version = "3.10"
files = ["app", "run.py", "tools"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = false
