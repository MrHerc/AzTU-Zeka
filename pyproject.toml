# Tooling configuration only — the application itself has no build step and no runtime dependencies
# (Python 3.10+ standard library). Development tools are listed in requirements-dev.txt.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["backend", ".", "tools"]
addopts = "-ra --strict-markers"
# An unclosed SQLite connection (reported by Python 3.13+) or socket fails the test instead of passing silently.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "slow: tests that spawn a subprocess (backend/run.py start-up checks) or measure at scale (query plans, the timetable solver)",
]

[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = ["i18n", "frontend", "content"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "DTZ005", "DTZ011"]   # DTZ: the clock lives in backend/zeka/core/clock.py
# The code base deliberately uses long lines (SQL, HTML templates, seed data); the limit is not enforced.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Parametric quiz templates set up several physics quantities on one line (R = …; I = …; U = I * R).
# and name them as in physics (R, I, U), which E741 flags as ambiguous.
"backend/zeka/legacy/engine.py" = ["E702", "E741"]
"tests/**" = ["DTZ005", "DTZ011"]
"tools/**" = ["DTZ005", "DTZ011"]
".github/**" = ["DTZ005", "DTZ011"]

[tool.mypy]
python_version = "3.10"
files = ["backend", "tools"]
mypy_path = "backend"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = false
