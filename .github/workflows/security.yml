# Dependency and secret scanning (see docs/SECURITY_REVIEW.md).
#  - secrets:       gitleaks over the full git history on schedule/manual runs, over the new commits on push/PR
#  - dependencies:  pip-audit for every requirements file + support status of the pinned CPython runtime
#  - code:          bandit static analysis (medium+ severity and confidence)
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 2 * * 1"     # weekly, Monday 02:41 UTC (also catches new advisories with no code change)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history: leaked secrets stay valid after a later commit deletes them
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Only organisation-owned repositories need a license key; leave the secret unset for a personal account.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install scanners
        run: python -m pip install --disable-pip-version-check -r .github/security-tools/requirements.txt
      - name: pip-audit (all requirements files)
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*requirements*.txt')
          if [ ${#files[@]} -eq 0 ]; then echo "No requirements files."; exit 0; fi
          for f in "${files[@]}"; do
            echo "::group::pip-audit -r $f"
            pip-audit --progress-spinner off --strict --desc on -r "$f"
            echo "::endgroup::"
          done
      - name: CPython runtime support (render.yaml PYTHON_VERSION)
        # The app is stdlib-only, so the interpreter is its runtime dependency: fail when the pinned release line is
        # end-of-life or an exact patch pin is behind the latest security release; warn six months before end-of-life.
        run: python .github/security-tools/check_python_runtime.py render.yaml

  code:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install scanners
        run: python -m pip install --disable-pip-version-check -r .github/security-tools/requirements.txt
      - name: bandit
        run: bandit -r app run.py tools --severity-level medium --confidence-level medium
