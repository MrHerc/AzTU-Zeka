name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Mypy (type check)
        run: mypy
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript syntax check
        run: for f in frontend/js/*.js; do node --check "$f"; done
      - name: Translation catalogue is complete and built
        # Compares parsed JSON: the extractor's key order differs between Python versions, the content must not.
        run: |
          python tools/i18n.py stats
          python -m pytest -q -p no:cacheprovider tests/unit/test_i18n_catalog.py

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux takes about 10 minutes; Windows about twice that (process start, file system), so it gets more room
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The demo is usually started on Windows (start_demo.bat); run the suite there too.
          - os: windows-latest
            python: "3.12"
          # one Linux job runs in a timezone far from Baku: the code must read the university clock, not the OS one
          - os: ubuntu-latest
            python: "3.13"
            tz: America/Los_Angeles
    env:
      PYTHONUTF8: "1"
      TZ: ${{ matrix.tz || 'UTC' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit and integration tests
        run: python -m pytest --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore

  browser:
    # The jobs above skip every browser test (no Playwright there); this one runs them (Task 42).
    name: Browser tests (Playwright, axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      NODE_PATH: ${{ github.workspace }}/tests/e2e/node_modules
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Playwright and axe-core
        run: npm ci --prefix tests/e2e
      - name: Install Chromium
        run: npx --prefix tests/e2e playwright install --with-deps chromium
      - name: Both resolve, so the tests below cannot pass by skipping
        run: node -e "require('playwright'); require.resolve('axe-core')"
      - name: Run the browser tests
        run: >-
          python -m pytest -q -p no:cacheprovider -rs
          tests/integration/test_e2e_smoke.py tests/integration/test_a11y.py
          tests/integration/test_exam_page.py tests/integration/test_exam_page_checkpoint_d.py
          tests/integration/test_clubs_page.py
