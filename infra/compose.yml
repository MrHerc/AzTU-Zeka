# Production: Caddy (TLS, 16 MB request limit) in front of the app. From the repository root:
#   cp infra/.env.example infra/.env        # fill it in: docs/runbooks/deploy.md explains every variable
#   docker compose -f infra/compose.yml up -d --build
# The app has no published port: only Caddy reaches it, on the internal network. Demo: infra/compose.demo.yml.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: zeka-aztu:latest
    env_file: .env
    expose:
      - "5070"
    volumes:
      - zeka-data:/var/lib/zeka/data
      - zeka-backups:/var/lib/zeka/backups
      - zeka-logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *logging

  # Backups run in their own short-lived container, so the web process never holds the backup key or the ssh key:
  #   docker compose -f infra/compose.yml run --rm backup                       (daily, from cron: docs/runbooks/backup.md)
  #   docker compose -f infra/compose.yml run --rm backup infra/restore.sh /var/lib/zeka/backups/latest.enc /var/lib/zeka/backups/restore-test
  backup:
    image: zeka-aztu:latest
    profiles:
      - backup
    env_file: .env
    command: ["infra/backup.sh"]
    volumes:
      - zeka-data:/var/lib/zeka/data
      - zeka-backups:/var/lib/zeka/backups
      # ssh key and known_hosts for BACKUP_REMOTE=user@host:/path (owner 10001, mode 600)
      - ./secrets/ssh:/var/lib/zeka/.ssh:ro
    secrets:
      - backup_key
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in infra/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging: *logging

secrets:
  backup_key:
    file: ./secrets/backup.key       # one random line, owner 10001, mode 600 (BACKUP_KEY_FILE=/run/secrets/backup_key)

volumes:
  zeka-data:
  zeka-backups:
  zeka-logs:
  caddy-data:
  caddy-config:
