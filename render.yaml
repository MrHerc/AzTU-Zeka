# Render Blueprint — AzTU Rəqəmsal Kampus (Zəka) demo
# Render-də: New + → Blueprint → bu reponu seç. render.yaml avtomatik oxunur.
# App yalnız Python standart kitabxanasından istifadə edir, əlavə paket (requirements.txt) yoxdur.
services:
  - type: web
    name: zeka-aztu
    runtime: python
    plan: free
    region: frankfurt            # Azərbaycana ən yaxın pulsuz region
    branch: main
    # Əlavə asılılıq yoxdur; pip-i yeniləmək kifayətdir.
    buildCommand: "python -m pip install --upgrade pip"
    # Render $PORT verir; serveri 0.0.0.0-da dinlədirik ki, xaricdən əlçatan olsun.
    # The free plan has no disk, so every start builds a fresh demo database: load NIST's NICE file first (about 1 s;
    # Bloom and EQF are built in), then start. The demo seed itself skips NICE to keep the test suite fast.
    startCommand: "python backend/manage.py import-framework --file content/frameworks/nice-components-2.2.0.json && python backend/run.py --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      # Yalnız major.minor: Render hər deploy-da ən son patch buraxılışını götürür və CPython təhlükəsizlik düzəlişləri avtomatik gəlir.
      # (Əvvəl 3.12.6 sabitlənmişdi. App yalnız stdlib istifadə edir, ona görə yeganə runtime asılılığı Python-un özüdür.)
      - key: ZEKA_ALLOW_OPEN_DEMO      # demo on a reachable host: the access code below still gates the login
        value: "1"
      - key: PYTHON_VERSION
        value: "3.13"
      # Demo girişi parolsuzdur: ictimai serverdə ziyarətçi əvvəlcə bu ortaq kodu daxil edir. Render təsadüfi dəyər yaradır;
      # kodu Dashboard → Environment bölməsində görmək və ya yadda qalan dəyərlə əvəz etmək olar. Diqqət: yuxarıdakı
      # ZEKA_ALLOW_OPEN_DEMO=1 olduğu üçün kod silinsə server kodsuz, hamıya açıq başlayır: bu dəyişəni boş saxlamayın.
      - key: ZEKA_ACCESS_CODE
        generateValue: true
      # Render-in proksisi X-Forwarded-For başlığına müştərinin IP ünvanını əlavə edir (sürət limitləri üçün).
      - key: ZEKA_PROXY_HOPS
        value: "1"
      # QR kodları və sənəd keçidləri bu ünvana yönəlsin. Render xidmətin öz xarici hostunu avtomatik doldurur
      # (məs. zeka-aztu.onrender.com); backend/run.py onun qarşısına https:// əlavə edir.
      - key: PUBLIC_URL
        fromService:
          type: web
          name: zeka-aztu
          property: host
    # Pulsuz plan sabit disk dəstəkləmir. Baza (data/campus.db) hər restartda sıfırdan yaradılır:
    # store.init() baza olmayanda demo məlumatları ilə avtomatik doldurur. Demo üçün bu, təmiz başlanğıc deməkdir.
    # Qeyd: yüklənən fayllar və razılıq/bələdçi vəziyyəti də restartda sıfırlanır.
