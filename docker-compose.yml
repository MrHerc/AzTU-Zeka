# One command:  docker compose up --build   →  http://localhost:5070/?demo=1  (3-minute Zəka Radar demo)
services:
  zeka:
    build: .
    image: zeka-aztu-demo:latest
    ports:
      - "5070:5070"
    environment:
      # QR codes on issued documents point here; change it when the demo runs on a public host
      PUBLIC_URL: "http://localhost:5070"
      # Optional real LLM (otherwise the offline engine answers; the demo does not need it):
      # AZTU_LLM_PROVIDER: anthropic
      # AZTU_LLM_MODEL: claude-sonnet-5-5
      # AZTU_LLM_API_KEY: ${AZTU_LLM_API_KEY}
    restart: unless-stopped
